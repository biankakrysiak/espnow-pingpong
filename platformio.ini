[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:host]
build_src_filter =
  +<host/>
  +<common/>
build_flags = -Isrc/common
lib_deps =
  links2004/WebSockets
  h2zero/NimBLE-Arduino@^1.4.3

[env:client]
build_src_filter =
  +<client/>
  +<common/>
build_flags = -Isrc/common